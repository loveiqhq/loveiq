name: Health Monitor

on:
  push:
    branches: [main, staging]
  schedule:
    # Also runs every day at 8:00 AM UTC to catch non-deploy outages
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

# Keyed on ref so main and staging health checks never cancel each other; a
# newer push to the same target supersedes an in-flight check (it re-probes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    name: Environment Health Check
    runs-on: ubuntu-latest
    env:
      TARGET_NAME: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
      TARGET_URL: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'https://staging.loveiq.org' || 'https://www.loveiq.org' }}
    steps:
      - name: Wait for Vercel deployment
        # Only wait after a push — scheduled/manual runs check current prod state
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check /api/health
        id: health
        env:
          STAGING_BYPASS_TOKEN: ${{ secrets.VERCEL_STAGING_PROTECTION_BYPASS }}
        run: |
          HEALTH_URL="$TARGET_URL/api/health"
          CURL_ARGS=(-s -L -w "\n%{http_code}")

          if [ "$TARGET_NAME" = "staging" ]; then
            if [ -z "$STAGING_BYPASS_TOKEN" ]; then
              echo "Missing VERCEL_STAGING_PROTECTION_BYPASS secret"
              exit 1
            fi

            COOKIE_JAR="$(mktemp)"
            HEALTH_URL="$HEALTH_URL?x-vercel-set-bypass-cookie=true&x-vercel-protection-bypass=$STAGING_BYPASS_TOKEN"
            CURL_ARGS=(-s -L -c "$COOKIE_JAR" -b "$COOKIE_JAR" -w "\n%{http_code}")
          fi

          RESPONSE=$(curl "${CURL_ARGS[@]}" "$HEALTH_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          BODY_PREVIEW=$(printf '%s' "$BODY" | tr '\n' ' ' | tr '\r' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-400)

          echo "HTTP status: $HTTP_STATUS"
          echo "Response preview: $BODY_PREVIEW"
          echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "HEALTH CHECK FAILED: status $HTTP_STATUS"
            exit 1
          fi

          echo "$TARGET_NAME health check passed"

name: UX digest — does it tell the truth

# Every probe checks the product. This checks the daily UX digest: each claim of
# the one actually delivered, re-asked over its own 24 hours from a source it
# did not use (the survey tables, GitHub, PostHog). Why it exists, and what it
# does not check: features/ux-review/server/digest-audit.ts.

# NO `schedule:`. Vercel's clock starts this at 08:41 and 10:41 UTC
# (features/cron/server/github-jobs.ts): after the digest in both summer (07:17
# UTC) and winter (08:17 UTC), and once more as a fallback. GitHub's own
# schedule starts this repo's jobs hours late and drops some. The script posts
# at most once per digest, so two runs never mean two alerts.
on:
  workflow_dispatch:
    inputs:
      on_time:
        description: "Started by the clock (records the run for the stall watchdog)"
        required: false
        type: boolean
        default: false
      post:
        description: "Post a false claim to Slack (off = check and print only)"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ux-digest-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: echo "START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # A check that cannot fail reads exactly like one that passed. MUTATE=1
      # overstates the digest's finisher count by one on live data; anything
      # but exit 1 means the audit has stopped being able to say no.
      - name: The audit can still say no
        env:
          MUTATE: "1"
        run: |
          set +e
          npx tsx scripts/audit-ux-digest.mjs
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::with a false claim injected the audit exited $code, not 1"
            exit 1
          fi

      # Exit 1 fails the run AND posts the disagreement; exit 3 (a source could
      # not be read) fails it without posting, because "could not check" must
      # never read as "every claim held".
      - name: Re-ask every claim of the last digest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_COMMITS_WEBHOOK_URL }}
          POST: ${{ inputs.post }}
        run: |
          set +e
          if [ "$POST" = "true" ]; then
            npx tsx scripts/audit-ux-digest.mjs --post
          else
            npx tsx scripts/audit-ux-digest.mjs
          fi
          code=$?
          echo "AUDIT_EXIT=$code" >> "$GITHUB_ENV"
          exit $code

      # For the stall watchdog (features/cron/server/cron-stall.ts): a job that
      # never starts cannot say so. Only the clock's runs count, so hand-started
      # ones cannot hide a stopped clock. A false claim (exit 1) is the audit
      # working; only exit 3, or a job that died before the audit ran, is
      # recorded as an error. format() because the clock sends "true" through the
      # API and the Actions tab sends a boolean.
      - name: Record that the audit ran
        if: always() && format('{0}', inputs.on_time) == 'true'
        run: |
          case "${AUDIT_EXIT:-none}" in
            0|1) outcome=success ;;
            *) outcome=error ;;
          esac
          npx tsx scripts/record-cron-run.mjs ux-digest-audit "$outcome"

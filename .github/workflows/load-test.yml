name: Load Test

# Triggers:
#  - Weekly cron (Mon 06:00 UTC): full smoke against staging
#  - Manual dispatch: choose smoke/load/spike + target
#  - PR (paths-filtered): smoke only, against the Vercel preview URL
on:
  schedule:
    # Every Monday at 6:00 AM UTC — smoke test against staging
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - load
          - spike
      target_url:
        description: "Target URL (defaults to production)"
        required: false
        default: "https://www.loveiq.org"
  pull_request:
    branches: [main]
    paths:
      - "app/api/**"
      - "proxy.ts"
      - "next.config.*"
      - "lib/**"
      - "features/**"
      - "shared/**"
      - "load-tests/**"
      - ".github/workflows/load-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load-test:
    name: k6 ${{ inputs.test_type || 'smoke' }} test
    runs-on: ubuntu-latest
    env:
      # PR runs always smoke; cron + dispatch use the dispatched type or default to smoke.
      TEST_TYPE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.test_type || 'smoke' }}
      # PR runs target staging (stable, always-on). Cron defaults to staging too. Dispatch can override.
      # If you want per-PR preview testing, set repo var VERCEL_PREVIEW_URL and adjust this expression.
      TARGET_URL: ${{ inputs.target_url || 'https://staging.loveiq.org' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Verify target reachable
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${TARGET_URL}/api/health" || echo "000")
          echo "Health check: HTTP $STATUS at ${TARGET_URL}/api/health"
          if [ "$STATUS" -ne 200 ]; then
            echo "ERROR: ${TARGET_URL} not healthy"
            exit 1
          fi

      - name: Run ${{ env.TEST_TYPE }} test
        run: |
          k6 run \
            -e BASE_URL="${{ env.TARGET_URL }}" \
            --out json=k6-results.json \
            load-tests/${{ env.TEST_TYPE }}.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-results-${{ env.TEST_TYPE }}-${{ github.run_id }}
          path: k6-results.json
          retention-days: 30

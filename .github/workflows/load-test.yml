name: Load Test

# Manual trigger + weekly scheduled smoke test on staging.
# Run manually before any major launch, marketing campaign, or traffic event.
on:
  schedule:
    # Every Monday at 6:00 AM UTC — smoke test against staging
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - load
          - spike
      target_url:
        description: "Target URL (defaults to production)"
        required: false
        default: "https://www.loveiq.org"

permissions:
  contents: read

jobs:
  load-test:
    name: k6 ${{ inputs.test_type || 'smoke' }} test → ${{ inputs.target_url || 'https://staging.loveiq.org' }}
    runs-on: ubuntu-latest
    env:
      # Default to smoke/staging for scheduled runs (inputs.* is empty on schedule)
      TEST_TYPE: ${{ inputs.test_type || 'smoke' }}
      TARGET_URL: ${{ inputs.target_url || 'https://staging.loveiq.org' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Run ${{ env.TEST_TYPE }} test
        run: |
          k6 run \
            -e BASE_URL="${{ env.TARGET_URL }}" \
            --out json=k6-results.json \
            load-tests/${{ env.TEST_TYPE }}.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: k6-results-${{ env.TEST_TYPE }}
          path: k6-results.json
          retention-days: 30

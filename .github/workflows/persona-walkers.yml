name: Persona walks on staging

# Four scripted people a night take the survey on staging.loveiq.org, one archetype each,
# read the free report, buy a plan with Stripe's test card and read what they bought
# (scripts/walkers/walk.ts; which four: scripts/walkers/rotation.ts). A judge on the
# teamwork@ Claude seat then says what a real person would have run into, against Marcus's
# 22 signals; a second pass tries to prove each finding wrong; what survives goes to #brain
# and to Jarvis (scripts/walkers/judge.ts).
#
# STAGING ONLY. A walk submits, pays and emails. On staging all three are harmless: its own
# database, Stripe in test mode, its alerts in #brain, email to Resend's test inbox.
# walk.ts refuses any other host.
#
# NOTHING IS UPLOADED. This repository is public, and so are its artifacts and logs; the
# screenshots include the unlocked paid report. The walks and the judge share one job so
# the screenshots never leave the runner, and the log carries counts, not findings.
#
# NO `schedule:`. Vercel's clock starts it at 02:41 UTC (features/cron/server/github-jobs.ts):
# GitHub's own schedule starts this repository's jobs hours late.

on:
  workflow_dispatch:
    inputs:
      walks:
        description: 'Optional: a JSON list of {"persona","device","plan"}. Empty walks tonight''s rotation.'
        required: false
        default: ""
      judge:
        description: "Judge the walks and post the result (off: walk only, post nothing)"
        type: boolean
        default: true
      proof:
        description: "Also run the UX checker's proof walks and the purchase-sequence walk (production's code, staging's database)"
        type: boolean
        default: true

permissions:
  contents: read

# One night at a time: two runs would walk the same people and post twice.
concurrency:
  group: persona-walkers
  cancel-in-progress: false

jobs:
  walk:
    # macOS, for the phone walks: WebKit on Linux cannot load Stripe's checkout ("Something
    # went wrong" after a blank form, on every run of 2026-09-29), while the same walks pay
    # on macOS. Free here, like every GitHub-hosted runner on a public repository.
    runs-on: macos-latest
    # What the job allows its own parts, added up: four walks of up to 20 minutes, two judge
    # passes of up to 25, and about 15 to install. A walk takes about eight minutes.
    timeout-minutes: 150
    steps:
      # No GitHub token left in .git/config: the judge can read this folder.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      # Staging's own code, for the judge to trace a finding to (the walk runs from main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          path: staging
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: main/package-lock.json

      - run: npm ci
        working-directory: main

      - run: npx playwright install --with-deps chromium webkit
        working-directory: main

      - name: Walk
        working-directory: main
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          # Through the environment: `${{ }}` inside `run:` is substituted before bash sees it.
          WALKS: ${{ inputs.walks }}
          WALK_OUT: ${{ runner.temp }}/walks
        run: |
          set -uo pipefail
          mkdir -p "$WALK_OUT"
          if [ -z "${STAGING_PASSWORD:-}" ]; then
            echo "::error::STAGING_PASSWORD is not set, so no walk can pass the staging gate"
            exit 1
          fi
          if [ -z "$WALKS" ]; then WALKS=$(npx tsx scripts/walkers/rotation.ts); fi
          if ! jq -e 'type == "array" and length > 0' <<<"$WALKS" >/dev/null; then
            echo "::error::walks must be a non-empty JSON list of {persona, device, plan, report}"
            exit 1
          fi
          # One at a time: the survey allows three submissions a minute from one address. Each
          # walk has 20 minutes (walk.ts keeps the time); one that runs over writes its own
          # record and stops.
          while read -r w; do
            rc=0
            npx tsx scripts/walkers/walk.ts \
              --persona "$(jq -r .persona <<<"$w")" \
              --device "$(jq -r .device <<<"$w")" \
              --plan "$(jq -r .plan <<<"$w")" \
              --report "$(jq -r '.report // "default"' <<<"$w")" </dev/null || rc=$?
            # 2 is a walk we asked for wrongly: noted, judged with the rest, and it fails the
            # job at the end. Anything else (1) is a walk that stopped early: the judge
            # reports it, and a walk-only run fails on it.
            if [ "$rc" -eq 2 ]; then
              touch "$WALK_OUT/.bad-request"
            elif [ "$rc" -ne 0 ]; then
              touch "$WALK_OUT/.walk-failed"
            fi
          done < <(jq -c '.[]' <<<"$WALKS")

      # The latest release on every run, like the brain's other jobs (Eman's call, 2026-09-30).
      # The version goes in the log, so a night that behaves differently can be traced to it.
      - name: Install Claude Code
        if: ${{ !cancelled() && inputs.judge }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Judge and post
        if: ${{ !cancelled() && inputs.judge }}
        working-directory: main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_BRAIN_WEBHOOK_URL: ${{ secrets.SLACK_BRAIN_WEBHOOK_URL }}
          BRAIN_LLM_CLI: claude
          NODE_ENV: production
          WALK_OUT: ${{ runner.temp }}/walks
        run: |
          set -uo pipefail
          missing=""
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CLAUDE_CODE_OAUTH_TOKEN SLACK_BRAIN_WEBHOOK_URL; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          rc=0
          npx tsx scripts/walkers/judge.ts --walks "$WALK_OUT" --staging-src ../staging || rc=1
          # The judge writes the message even when it could not judge: the walks' own checks
          # are facts and are worth posting on their own.
          if [ -s "$WALK_OUT/slack.txt" ]; then
            jq -Rs '{text: .}' "$WALK_OUT/slack.txt" |
              curl -sS --fail -X POST -H 'Content-type: application/json' --data @- "$SLACK_BRAIN_WEBHOOK_URL" &&
              touch "$WALK_OUT/.posted" || rc=1
          fi
          exit $rc

      - name: Fail on a walk asked for wrongly, or a stopped walk
        if: ${{ !cancelled() }}
        env:
          WALK_OUT: ${{ runner.temp }}/walks
        run: |
          if [ -f "$WALK_OUT/.bad-request" ]; then
            echo "::error::A walk was asked for with an unknown persona, device, plan or report"
            exit 1
          fi
          # Judged or not: the night's message says it too, but from 2 to 5 October 2026 it said
          # "0 of 4 reached the end" four nights running with the run green, and nobody looked.
          if [ -f "$WALK_OUT/.walk-failed" ]; then
            echo "::error::A walk stopped before the end; the log above says where"
            exit 1
          fi

      # Anything that stopped the night: a missing secret, a failed install, the seat's limit.
      # Silent when the night's message already went out, which says what went wrong itself.
      - name: Tell the brain channel the walks failed
        if: (failure() || cancelled()) && inputs.judge
        env:
          SLACK_BRAIN_WEBHOOK_URL: ${{ secrets.SLACK_BRAIN_WEBHOOK_URL }}
          WALK_OUT: ${{ runner.temp }}/walks
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -f "$WALK_OUT/.posted" ] || [ -z "${SLACK_BRAIN_WEBHOOK_URL:-}" ]; then exit 0; fi
          how="failed"
          if [ "${JOB_STATUS:-}" = "cancelled" ]; then how="was stopped before it finished (cancelled or timed out)"; fi
          text=":walking: The persona walks on staging ${how} in GitHub Actions. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg text "$text" '{text: $text}' |
            curl -sS --fail -X POST -H 'Content-type: application/json' --data @- "$SLACK_BRAIN_WEBHOOK_URL"

  # The UX checker's proof (features/ux-signals): four walks a night of production's code on
  # staging's database (walk.ts MAIN_ON_STAGING), each planting behaviours on purpose and so
  # knowing the truth of what it did. check-signals.ts stores each walk's events and truth,
  # and Jarvis's ux_signals shows a signal only once its measure is right on 80% of them.
  # Not judged and nothing posted; its own runner, alongside the walks above. The log says
  # counts only: this repository and its logs are public. After them, on the same code, the
  # purchase-sequence walk (below), which does post when it fails.
  proof:
    if: ${{ inputs.proof }}
    runs-on: macos-latest
    # Five walks of up to 20 minutes (four proof walks and the sequence) and about 15 to install.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      - name: Proof walks
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          WALK_OUT: ${{ runner.temp }}/proof
          WALK_ORIGIN: https://loveiq-staging-git-main-loveiq.vercel.app
        run: |
          set -uo pipefail
          mkdir -p "$WALK_OUT"
          if [ -z "${STAGING_PASSWORD:-}" ]; then
            echo "::error::STAGING_PASSWORD is not set, so no walk can pass the staging gate"
            exit 1
          fi
          # One at a time, for the survey's three submissions a minute from one address. A walk
          # that stops early writes no truth, so it is simply not counted.
          while read -r w; do
            quit=$(jq -r '.quit // ""' <<<"$w")
            npx tsx scripts/walkers/walk.ts --proof \
              --persona "$(jq -r .persona <<<"$w")" \
              --device "$(jq -r .device <<<"$w")" \
              --plan "$(jq -r .plan <<<"$w")" \
              ${quit:+--quit "$quit"} </dev/null || true
          done < <(npx tsx scripts/walkers/plants.ts | jq -c '.[]')

      - name: Store the walks, and record the run
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WALK_OUT: ${{ runner.temp }}/proof
        run: |
          set -uo pipefail
          outcome=success
          npx tsx scripts/walkers/check-signals.ts --walks "$WALK_OUT" || outcome=error
          # The stall watcher (features/cron/server/cron-stall.ts) alerts #ops when this goes quiet.
          npx tsx scripts/record-cron-run.mjs ux-proof-walks "$outcome"
          [ "$outcome" = success ]

      # What broke on production on 2026-10-06 (#524), which no walk caught because each
      # bought once: another archetype's report bought from "Other Archetypes" first, then the
      # walk's own (walk.ts --sequence other-first). On production's code, like the proof
      # walks: the staging branch does not carry that fix. Its own folder: check-signals.ts
      # would count a walk with no truth as a proof walk that stopped. A phone and a desktop
      # on alternate nights, the next persona every second night. A failed check stops the
      # walk and fails the job.
      - name: Buy another archetype's report first, then your own
        id: sequence
        if: ${{ !cancelled() }}
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          WALK_OUT: ${{ runner.temp }}/sequence
          WALK_ORIGIN: https://loveiq-staging-git-main-loveiq.vercel.app
        run: |
          set -uo pipefail
          day=$(( $(date -u +%s) / 86400 ))
          persona=$(jq -r --argjson d "$day" '.personas[($d / 2 | floor) % (.personas | length)].archetype' scripts/walkers/personas.json)
          device="Desktop Chrome"
          if [ $((day % 2)) -eq 0 ]; then device="iPhone 15 Pro"; fi
          npx tsx scripts/walkers/walk.ts --sequence other-first --plan full_report \
            --persona "$persona" --device "$device" </dev/null

      # Nothing else in this job posts, so this walk says so itself. Its stop reason comes
      # from walk.ts, redacted: no report token, Stripe session or query string.
      - name: Tell the brain channel the purchase sequence failed
        if: ${{ failure() && steps.sequence.outcome == 'failure' && inputs.judge }}
        env:
          SLACK_BRAIN_WEBHOOK_URL: ${{ secrets.SLACK_BRAIN_WEBHOOK_URL }}
          WALK_OUT: ${{ runner.temp }}/sequence
        run: |
          set -uo pipefail
          if [ -z "${SLACK_BRAIN_WEBHOOK_URL:-}" ]; then exit 0; fi
          why=$(jq -rs 'map(.stoppedAt // empty) | first // "no reason recorded"' "$WALK_OUT"/*/walk.json 2>/dev/null) ||
            why="its record could not be read"
          lead=":walking: Buying another archetype's report first, then your own, failed on production's code (staging's database)"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Escaped for Slack: the reason can quote words from a page.
          jq -n --arg lead "$lead" --arg why "$why" --arg run "$run" \
            '{text: ($lead + ": " + ($why | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")) + ". " + $run)}' |
            curl -sS --fail -X POST -H 'Content-type: application/json' --data @- "$SLACK_BRAIN_WEBHOOK_URL"

  # Two layout probes written with Report 3.0 (scripts/probes/README.md), against staging's
  # own report every night, on their own runner: nothing on a phone pans sideways or zooms
  # in on a tapped box, and closing the paywall on a desktop leaves the reader where they
  # were. Each exits 1 on a defect AND on a page it could not measure.
  layout:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      - name: Nothing pans sideways or zooms in on a phone
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          ORIGIN: https://staging.loveiq.org
        run: node scripts/probes/verify-no-sideways.mjs

      - name: Closing the paywall leaves a desktop reader where they were
        if: ${{ !cancelled() }}
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          ORIGIN: https://staging.loveiq.org
        run: node scripts/probes/verify-paywall-close-holds.mjs

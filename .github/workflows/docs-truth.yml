name: Documentation Truth Check

on:
  push:
    branches: [main, staging]
    paths:
      - "**/*.md"
      - "app/api/**/route.ts"
      - "features/admin/server/roles.ts"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - "proxy.ts"
      - "scripts/check-docs-truth.mjs"
      - "scripts/check-docs-impact.sh"
      - ".markdownlint-cli2.jsonc"
      - "cspell.json"
      - ".cspell/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/docs-truth.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "**/*.md"
      - "app/api/**/route.ts"
      - "features/admin/server/roles.ts"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - "proxy.ts"
      - "scripts/check-docs-truth.mjs"
      - "scripts/check-docs-impact.sh"
      - ".markdownlint-cli2.jsonc"
      - "cspell.json"
      - ".cspell/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/docs-truth.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-truth:
    name: Documentation Truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run source-driven documentation checks
        run: npm run docs:truth

      - name: Markdown lint
        run: npm run docs:lint

      - name: Spellcheck docs
        run: npm run docs:spell

      - name: Check markdown formatting
        run: npx prettier --check "**/*.md"

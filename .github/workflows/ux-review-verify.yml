name: UX review — verify findings

# Turns a scanner's claim into evidence. PostHog Replay Vision watches recordings
# and posts findings to Slack; this runs the probe that covers each finding
# against production and replies in the same thread with what actually happened.
#
# No model is involved. A probe cannot hallucinate, which is the whole reason
# this is the verification step rather than another LLM pass.

on:
  schedule:
    # Every 3 hours at :41 — off the :00/:30 marks every other workflow lands on,
    # and far enough apart that a finding is verified within one working morning
    # without re-running probes against production all day.
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How far back to look for findings"
        required: false
        default: "6"
      dry_run:
        description: "Verify and print, post nothing to Slack"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Reproduce findings against production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # The probes drive real devices on both engines — a fix verified on
      # Chromium alone has shipped broken to iOS here before.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit

      # Deliberately NOT a soft skip. Three lanes in this repo (integration,
      # migration-drift, E2E) guard on an unset secret and pass green while
      # testing nothing; this fails instead, because a verifier that silently
      # verifies nothing is worse than no verifier.
      - name: Check required secrets are present
        run: |
          missing=""
          for name in POSTHOG_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SLACK_BOT_TOKEN SLACK_JOURNEY_CHANNEL_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required secrets:$missing"
            exit 1
          fi
          echo "all required secrets present"
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_JOURNEY_CHANNEL_ID: ${{ secrets.SLACK_JOURNEY_CHANNEL_ID }}

      - name: Self-test the finding classifier
        run: node scripts/verify-ux-findings.mjs --selftest

      - name: Verify findings
        # The flag is chosen in SHELL, from an env var, rather than interpolated into the
        # `run:` string. `${{ }}` inside `run:` splices its value into the script before
        # bash sees it, so any context that can carry text becomes code execution on the
        # runner — semgrep's run-shell-injection rule blocks it, and that gate failed main.
        # `inputs.dry_run` is a boolean today, but the rule is about the shape, not this
        # input, and the shape is what a future edit inherits.
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/verify-ux-findings.mjs --dry-run
          else
            node scripts/verify-ux-findings.mjs
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '6' }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_JOURNEY_CHANNEL_ID: ${{ secrets.SLACK_JOURNEY_CHANNEL_ID }}

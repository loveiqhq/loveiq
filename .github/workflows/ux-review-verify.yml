name: UX review — verify findings

# Turns a scanner's claim into evidence. PostHog Replay Vision watches recordings
# and posts findings to Slack; this runs the probe that covers each finding
# against production and replies in the same thread with what actually happened.
#
# No model is involved. A probe cannot hallucinate, which is the whole reason
# this is the verification step rather than another LLM pass.

on:
  schedule:
    # Every 3 hours at :41 — off the :00/:30 marks every other workflow lands on,
    # and far enough apart that a finding is verified within one working morning
    # without re-running probes against production all day.
    - cron: "41 */3 * * *"
    # Monday morning, for the weekly scanner scoring step below. The 3-hourly
    # cron does not fire at this exact minute-and-hour combination, so the two
    # never collide.
    - cron: "41 9 * * 1"
  workflow_dispatch:
    inputs:
      lookback_hours:
        # NO DEFAULT, deliberately. A default here is not a fallback — it makes
        # `inputs.lookback_hours` non-empty on every dispatch, so the `|| '24'`
        # below never fires and a manual run silently used 6 while the script,
        # the workflow and the docs all said 24. Three copies of one number,
        # and the one that won was the least visible. Leave it blank to get the
        # real window; type a smaller number only to narrow a run on purpose.
        description: "How far back to look, in hours (blank = the normal window)"
        required: false
      dry_run:
        description: "Verify and print, post nothing to Slack"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  # `contents: write` and `pull-requests: write` exist so a REPRODUCED finding
  # can open a DRAFT pull request carrying its evidence. The script never
  # merges, never writes to main, and never generates a fix — it pushes one
  # branch holding a reproduction record. This repository is public, so the
  # token stays scoped to these two and the workflow is `schedule` +
  # `workflow_dispatch` only, never `pull_request_target`.
  contents: write
  pull-requests: write

jobs:
  verify:
    name: Reproduce findings against production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # The probes drive real devices on both engines — a fix verified on
      # Chromium alone has shipped broken to iOS here before.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit

      # Deliberately NOT a soft skip. Three lanes in this repo (integration,
      # migration-drift, E2E) guard on an unset secret and pass green while
      # testing nothing; this fails instead, because a verifier that silently
      # verifies nothing is worse than no verifier.
      - name: Check required secrets are present
        run: |
          missing=""
          for name in POSTHOG_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SLACK_BOT_TOKEN SLACK_JOURNEY_CHANNEL_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required secrets:$missing"
            exit 1
          fi
          echo "all required secrets present"
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_JOURNEY_CHANNEL_ID: ${{ secrets.SLACK_JOURNEY_CHANNEL_ID }}

      # Roughly half of eligible recordings are never opened by the scanner
      # whose query they matched — measured 2026-09-19 over the period since
      # they went live: 103 of 211 sessions watched by nothing, and only 225 of
      # 392 (session, scanner) pairs looked at. It is not credits (all four are
      # far under their limit), not sampling (rate 1), and not lag (the normal
      # cadence is ~38 minutes). PostHog simply does not pick up every matching
      # recording.
      #
      # So the gap is closed here rather than by hand. The enqueue is idempotent
      # — the workflow id is derived from (scanner, session) — so re-running
      # cannot double-charge.
      #
      # THE WINDOW WAS TWO DAYS, and that was wrong. The reasoning was that a
      # short window avoids "reaching back over recordings that have already
      # expired", but nothing expires that fast: measured 2026-09-20, PostHog
      # still holds every recording back to 2026-08-24, twenty-seven days. What
      # the short window actually did was make a miss PERMANENT after forty-eight
      # hours — four readers from 2026-09-13, one of them with 36 dead clicks,
      # had been unwatched for a week and no run could ever reach them again.
      #
      # The window is now the script's default (14 days) and the WORK is bounded
      # instead, by MAX_ENQUEUE, so a standing backlog drains over successive
      # runs oldest-reader-first rather than firing hundreds of observations at
      # once. The held count is printed on every run.
      - name: Re-queue recordings no scanner opened
        run: npx tsx scripts/ux-review-coverage.mjs --enqueue
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The only thing that measures whether the scanners are worth their
      # credits, and nothing has ever run it — it existed as a package script
      # and appeared in no workflow. Weekly rather than every run: it reads
      # fixture observations that are written once and never change, so running
      # it eight times a day would report the same numbers eight times a day.
      #
      # `continue-on-error` on purpose. It exits non-zero when the scanners are
      # BELOW BAR, which is their standing state (precision 0.20, recall 0.50
      # against 0.80/0.60) and is a fact about the scanners, not a fault in this
      # workflow. Failing the verify run for it would stop findings being
      # verified over a number nobody can fix from here.
      - name: Score the scanners (weekly)
        if: github.event.schedule == '41 9 * * 1' || github.event_name == 'workflow_dispatch'
        # BOTH sources, and the second is the one that survives.
        #
        # The fixtures are seven hand-curated recordings that EXPIRE 2026-09-28
        # and cannot be re-scanned — a scanner observes a given session once,
        # ever. `--ledger` scores from what the probes actually concluded, costs
        # nothing to collect and never expires. It was written, tested and
        # documented as the replacement, and then nothing ran it: this step
        # called the bare script, so every scheduled score came from the seven
        # rows that are about to die.
        #
        # It matters more than a tidy-up. On 84 ledger findings the precision is
        # 0.02, against 0.20 on the seven fixtures — the larger sample says the
        # scanners are ten times worse than the number this step has been
        # reporting.
        #
        # `continue-on-error` USED TO COVER THIS STEP and had to go, because it
        # cannot tell the two failures apart. Below bar (exit 1) and too few
        # labelled findings (exit 2) are facts about the scanners, not faults
        # here, and must not fail the run — findings still need verifying. But
        # the script also exits 3 for "a secret is missing" or "the ledger could
        # not be read", deliberately distinct so a broken score is never read as
        # a healthy one. `continue-on-error` swallowed 3 along with 1 and 2,
        # which is exactly the soft-skip failure three other lanes in this repo
        # already have.
        run: |
          set +e
          npx tsx scripts/replay-bench/score.mjs
          fixtures=$?
          npx tsx scripts/replay-bench/score.mjs --ledger
          ledger=$?
          set -e
          for code in "$fixtures" "$ledger"; do
            if [ "$code" = "3" ]; then
              echo "::error::scanner scoring could not run (exit 3) — a secret or the ledger read is broken, not a low score"
              exit 1
            fi
          done
          echo "scoring finished (fixtures=$fixtures ledger=$ledger); 1=below bar, 2=too few labels, both expected"
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The merge click IS the training data: a merged reproduction means the
      # finding was real, a closed one means it was not. Nobody has to label
      # anything — they just do the thing they were going to do anyway — and it
      # is the only signal in this pipeline that does not come from our own
      # machinery judging itself.
      #
      # It was designed in the plan and never wired up: measured 2026-09-19, the
      # ledger held 37 findings and 0 human labels.
      - name: Label findings from merged and closed pull requests
        run: node scripts/label-findings-from-prs.mjs --write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Self-test the finding classifier
        run: npx tsx scripts/verify-ux-findings.mjs --selftest

      - name: Verify findings
        # The flag is chosen in SHELL, from an env var, rather than interpolated into the
        # `run:` string. `${{ }}` inside `run:` splices its value into the script before
        # bash sees it, so any context that can carry text becomes code execution on the
        # runner — semgrep's run-shell-injection rule blocks it, and that gate failed main.
        # `inputs.dry_run` is a boolean today, but the rule is about the shape, not this
        # input, and the shape is what a future edit inherits.
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx tsx scripts/verify-ux-findings.mjs --dry-run
          else
            npx tsx scripts/verify-ux-findings.mjs
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Opening a PR is opt-in, so the script cannot do it from a laptop.
          UX_REVIEW_OPEN_PR: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The fallback must NOT be re-tuned here. It exists only so a manual
          # run can narrow the window; the real value lives with the reasoning,
          # in scripts/verify-ux-findings.mjs, and a number repeated in two
          # places drifts. It already did: the script default moved to 24 and
          # this stayed at 6, so the fix was a no-op on the only path that
          # matters. __tests__/scripts/verifier-budget.test.ts now fails if
          # these disagree.
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '24' }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_JOURNEY_CHANNEL_ID: ${{ secrets.SLACK_JOURNEY_CHANNEL_ID }}

name: Visual Regression

# Weekly scheduled run + manual trigger for on-demand checks.
on:
  schedule:
    # Mon 06:30 UTC — staggered 30 min off load-test.yml's 06:00 to avoid
    # runner contention (both are heavy long-running jobs).
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL (defaults to staging)"
        required: false
        default: "https://staging.loveiq.org"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-regression:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_URL: ${{ inputs.target_url || 'https://staging.loveiq.org' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npx playwright test visual-regression --project="Desktop Chrome"
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.TARGET_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-report
          path: playwright-report/
          retention-days: 14

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diffs
          path: test-results/
          retention-days: 14

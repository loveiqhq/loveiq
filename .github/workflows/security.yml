name: Security & Quality

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Run security scans weekly on Mondays at 9am UTC
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Workflow-level default kept minimal. security-events:write is granted only
  # to the codeql-analysis job that actually uploads SARIF results;
  # pull-requests:write is unused here (no PR comment posting).
  contents: read

jobs:
  # Secret scanning to detect hardcoded credentials
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fast last-10-commits scan on push/PR; the weekly schedule does a
          # FULL-history scan (depth 0) to catch older leaks. Truthy value sits
          # on the `&&` side because 0 is falsy in GitHub expressions
          # (`x && 0 || 10` would always yield 10).
          fetch-depth: ${{ github.event_name != 'schedule' && 10 || 0 }}

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@f446421baf832d6356c42c1743d99abff52ff334 # v3.95.7
        with:
          extra_args: --only-verified

  # SAST using Semgrep for security patterns
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      # Pinned by digest — image tags can be force-pushed. Bump together
      # with the version comment when upgrading. Digest source: Docker Hub
      # https://hub.docker.com/v2/repositories/semgrep/semgrep/tags/1.116.0
      image: semgrep/semgrep:1.116.0@sha256:70dbbcab41ba5899d21c081c90f7a08c624dd68ff551c7f76ca9e6d74ec30a22
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep (rule packs + gate on error-severity)
        # `--config auto` previously OVERRODE the SEMGREP_RULES env (semgrep gives
        # --config precedence), so none of the intended packs actually ran and the
        # SARIF was discarded — i.e. checkbox SAST. Pass the packs explicitly and
        # gate: `--error --severity ERROR` fails the job ONLY on error-severity
        # findings, so a future high-severity introduction blocks the merge while
        # warning/info noise does not break CI. The full findings (all severities)
        # print in this step's text output. The only ERROR-severity findings today
        # are the XXE rules on scripts/extract-scoring-xlsm.py — suppressed inline
        # with rule-scoped `# nosemgrep` there because that script parses a trusted
        # local workbook we author, not untrusted XML (false positive in context),
        # so the gate is 0 ERROR. SARIF upload to the Security tab still needs
        # GitHub Advanced Security (paid); re-add `--sarif --output` + an upload
        # step when enabled.
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --config p/typescript \
            --config p/nextjs \
            --error --severity ERROR --metrics off

  # CodeQL for deep code analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-scoped — only this job needs security-events:write for SARIF upload.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          # Use security-extended query suite for more thorough analysis
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{matrix.language}}"
          upload: false # Don't upload SARIF (requires Advanced Security)

  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Scan for known vulnerabilities (OSV)
        run: |
          # SHA-256 of osv-scanner v1.9.2 linux/amd64 — must match the published
          # release. Mismatch = supply chain tamper, abort. Verify and bump
          # together when upgrading.
          OSV_SHA256="d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b"
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --config=.osv-scanner.toml --lockfile=package-lock.json

      - name: License compliance (deny AGPL)
        run: |
          # Free license gate. AGPL's network-use copyleft is the real risk for a
          # hosted SaaS, so deny it across production deps. 0 AGPL today (verified);
          # this blocks a future AGPL-licensed dependency from shipping. GPL is
          # intentionally NOT denied: server-side SaaS use does not trigger GPL's
          # distribution copyleft, and listing "GPL-3.0" would substring-collide
          # with our one permissive dual-licensed dep (Apache-2.0 AND
          # LGPL-3.0-or-later). The self-package (UNLICENSED, private) is excluded.
          npx --yes license-checker-rseidelsohn --production \
            --excludePackages "loveiq-web@0.1.0" \
            --failOn "AGPL-1.0;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later"

  # Enhanced linting with security rules
  security-lint:
    name: Security-Enhanced Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with security rules
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-results.json

      - name: Display ESLint results
        run: |
          if [ -f eslint-results.json ]; then
            cat eslint-results.json | jq '.'
          fi

      # Unit tests run in the dedicated `test` job in ci.yml — duplicating here
      # would burn an extra ~38s of runner minutes on every push.

      - name: Standard ESLint
        run: npm run lint

  # Next.js specific security checks
  nextjs-security:
    name: Next.js Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for unsafe Next.js patterns
        run: |
          echo "Checking for common Next.js security issues..."

          # Check for dangerouslySetInnerHTML usage
          # Excludes:
          #  - JSON.stringify usage (safe JSON-LD structured data pattern in app/layout.tsx)
          #  - jsonLdString(...) — hardened JSON-LD serializer (shared/seo/json-ld.ts):
          #    JSON.stringify PLUS escaping of "<" so a value can never break out of the
          #    <script> tag (</script>). Strictly safer than the bare JSON.stringify above;
          #    used for the structured-data scripts in app/layout.tsx, app/page.tsx, app/about.
          #  - components/report/sections/ and components/report/ReportPage.tsx — these
          #    render escaped report-prose HTML built from sanitized server data
          #    (lib/report/contentGating.ts + the report data pipeline). Substitution
          #    helpers escape every variable; the HTML body comes from our own .docx
          #    pipeline, not user input. Reviewed and intentional.
          #  - features/landing/ui/white{,-v1}/LandingPageWhite{,V1}.tsx — a single static
          #    literal <style> ("html,body{background:#fff}"): NO interpolation and
          #    NO user input, server-rendered to stop the dark body bg showing
          #    through on the white A/B arms. A constant string cannot carry XSS.
          #    `-v1` is the pinned pre-rebuild arm of the landing A/B and carries the
          #    identical literal; it was added without this allow-list entry, which is
          #    what turned this job red on 2026-08-21.
          #  - app/glossary/page.tsx + app/glossary/[slug]/page.tsx — the same
          #    single static literal <style> ("html,body{background:#fff}"),
          #    server-rendered so the dark body bg doesn't flash before the white
          #    glossary hydrates. Constant string, no interpolation/user input.
          if grep -r "dangerouslySetInnerHTML" app/ features/ shared/ --include="*.tsx" --include="*.jsx" \
              | grep -v "JSON\.stringify" \
              | grep -v "jsonLdString" \
              | grep -vE "white/LandingPageWhite\.tsx|white-v1/LandingPageWhiteV1\.tsx" \
              | grep -vE "app/glossary/(page|\[slug\]/page)\.tsx" \
              | grep -vE "(components|features/report/ui)/(sections/|ReportPage\.tsx)"; then
            echo "⚠️  Found dangerouslySetInnerHTML usage - review for XSS risks"
            exit 1
          fi

          # Check for global eval() usage (code-injection risk). The previous
          # "\beval\(" was a malformed BRE (unclosed \( group) AND grepped
          # now-removed lib/ + components/ dirs, so grep errored (exit 2) and the
          # check never actually ran. This ERE matches a bare `eval(` call
          # (start-of-line or after a non-identifier, non-dot char) but NOT a
          # method call like the Upstash redis/kv `.eval(` Lua API. Paths limited
          # to the dirs that exist post-refactor so grep exits 0/1, not 2.
          if grep -rEn "(^|[^.A-Za-z0-9_])eval\(" app/ features/ shared/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
            echo "⚠️  Found eval() usage - potential code injection risk"
            exit 1
          fi

          # Check for hardcoded secrets patterns
          if grep -rE "(api[_-]?key|api[_-]?secret|password|secret[_-]?key|private[_-]?key|token)\s*=\s*['\"][^'\"]{20,}" app/ lib/ features/ shared/ --include="*.ts" --include="*.tsx" --include="*.js"; then
            echo "⚠️  Potential hardcoded secrets found"
            exit 1
          fi

          echo "✅ No obvious Next.js security issues found"

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.loveiq.org
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: dummy

      - name: Check build output for sensitive data
        run: |
          echo "Checking build output for leaked secrets..."

          # Check .next build output for potential secrets (actual values, not just variable names)
          # Look for patterns like: SUPABASE_SERVICE_ROLE_KEY=actual-secret-value
          if grep -rE "(SUPABASE_SERVICE_ROLE_KEY|RESEND_API_KEY|RECAPTCHA_SECRET_KEY)\s*[:=]\s*['\"]?[a-zA-Z0-9_-]{20,}" .next/ 2>/dev/null | grep -v "process.env" | grep -v "undefined"; then
            echo "⚠️  WARNING: Actual secrets found in build output!"
            exit 1
          fi

          echo "✅ No secrets found in build output"

  # NOTE: Playwright E2E tests (e2e/) are kept intact for local use and will be
  # re-added to CI when the survey feature launches with proper test coverage.

  # Custom security rules check
  custom-security-rules:
    name: Custom Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check API route security patterns
        run: |
          echo "Validating API route security patterns..."

          # Check that all API routes use CSRF verification
          # Excludes:
          #  - staging-* routes (dev-only endpoints that return 404 in production)
          #  - stripe/webhook (verified via Stripe signature header instead of CSRF)
          #  - resend/webhook (verified via Svix signature header instead of CSRF)
          #  - calendly/webhook (verified via Calendly signature header instead of CSRF)
          #  - unsubscribe (RFC 8058 one-click; auth via HMAC-signed token in URL — email clients cannot send CSRF cookies)
          #  - csp-report (browsers POST CSP violation reports automatically with no token/cookie; rate-limited + body-bounded instead)
          #  - slack/events (verified via the Slack v0 request signature; Slack is a server, so it has no CSRF cookie to send)
          #  - mcp (machine-to-machine JSON-RPC; auth is a static bearer token, and claude.ai calls it cross-origin with no cookie at all)
          for file in $(find app/api -name 'route.ts' \
              -not -path "*/staging-*" \
              -not -path "*/stripe/webhook/*" \
              -not -path "*/resend/webhook/*" \
              -not -path "*/calendly/webhook/*" \
              -not -path "*/unsubscribe/*" \
              -not -path "*/csp-report/*" \
              -not -path "*/slack/events/*" \
              -not -path "*/mcp/*" \
              2>/dev/null); do
            if [ -f "$file" ] && grep -q "export.*POST\|export.*PUT\|export.*DELETE\|export.*PATCH" "$file"; then
              # Accept any CSRF verifier helper from shared/http/csrf.ts:
              #   - verifyCsrfToken / verifyCsrfTokenFromBody — header-only or body-only paths
              #   - verifyCsrfHeaderOrBody — beacon-friendly helper that prefers header, falls back to body
              if ! grep -qE "verifyCsrf(Token|HeaderOrBody)" "$file"; then
                echo "⚠️  $file: POST/PUT/DELETE/PATCH route missing CSRF verification"
                exit 1
              fi
            fi
          done

          # Check that all API routes use rate limiting
          # Excludes:
          #  - staging-* routes (dev-only endpoints that return 404 in production)
          #  - stripe/webhook (Stripe retries delivery; rate-limiting it would drop legitimate events)
          #  - resend/webhook (Resend retries delivery; rate-limiting drops legitimate events)
          #  - calendly/webhook (Calendly retries delivery; rate-limiting drops legitimate events)
          #  - unsubscribe (RFC 8058 one-click; HMAC-signed token gates access — brute-force infeasible)
          for file in $(find app/api -name 'route.ts' \
              -not -path "*/staging-*" \
              -not -path "*/stripe/webhook/*" \
              -not -path "*/resend/webhook/*" \
              -not -path "*/calendly/webhook/*" \
              -not -path "*/unsubscribe/*" \
              2>/dev/null); do
            if [ -f "$file" ] && grep -q "export.*POST" "$file"; then
              if ! grep -q "checkRateLimit" "$file"; then
                echo "⚠️  $file: POST route missing rate limiting"
                exit 1
              fi
            fi
          done

          # Check that all API routes use Zod validation
          # Excludes:
          #  - staging-* routes (dev-only endpoints that return 404 in production)
          #  - stripe/webhook (validated via stripe.webhooks.constructEvent signature check)
          #  - resend/webhook (validated via Svix wh.verify signature check)
          #  - calendly/webhook (validated via Calendly signature check; body parsed after signature verify)
          #  - unsubscribe (auth via HMAC-signed token in URL; body is RFC 8058 fixed string)
          #  - admin/logout (no body to validate; just clears the auth session)
          #  - admin grant-call-coupon (no request body; acts on the validated [id] URL param)
          #  - csp-report (browser-sent CSP violation report JSON; parsed leniently across legacy + Reporting-API shapes, then bounded + logged — a strict schema would just drop valid reports)
          #  - slack/events (body is HMAC-verified against the Slack signing secret BEFORE it is parsed, same basis as the webhooks above)
          #  - mcp (JSON-RPC; every tool argument is explicitly type-checked and clamped by hand -- `typeof args.query === "string"`, `Math.min(30, Math.max(1, Number(args.limit) || 12))`, `encodeURIComponent` on anything reaching a URL -- which is stricter than a permissive schema, just not spelled with zod)
          for file in $(find app/api -name 'route.ts' \
              -not -path "*/staging-*" \
              -not -path "*/stripe/webhook/*" \
              -not -path "*/resend/webhook/*" \
              -not -path "*/calendly/webhook/*" \
              -not -path "*/unsubscribe/*" \
              -not -path "*/admin/logout/*" \
              -not -path "*/grant-call-coupon/*" \
              -not -path "*/csp-report/*" \
              -not -path "*/slack/events/*" \
              -not -path "*/mcp/*" \
              2>/dev/null); do
            if [ -f "$file" ] && grep -q "export.*POST\|export.*PUT" "$file"; then
              if ! grep -q "z\.object\|zod" "$file"; then
                echo "⚠️  $file: Route missing Zod schema validation"
                exit 1
              fi
            fi
          done

          echo "✅ All API routes follow security patterns"

      - name: Check for missing environment variables in code
        run: |
          echo "Checking for proper environment variable handling..."

          # Ensure no direct access to process.env outside of config files
          if grep -r "process\.env\." app/ components/ features/ --include="*.tsx" --include="*.jsx" | grep -v "NEXT_PUBLIC_"; then
            echo "⚠️  Found direct process.env access in client components (should use NEXT_PUBLIC_ prefix)"
          fi

          echo "✅ Environment variable handling check complete"

      - name: Verify security headers in middleware
        run: |
          echo "Verifying security headers configuration..."

          if [ ! -f "proxy.ts" ]; then
            echo "⚠️  proxy.ts not found!"
            exit 1
          fi

          # Check for essential security headers
          REQUIRED_HEADERS=(
            "Content-Security-Policy"
            "X-Frame-Options"
            "X-Content-Type-Options"
            "Strict-Transport-Security"
          )

          for header in "${REQUIRED_HEADERS[@]}"; do
            if ! grep -q "$header" proxy.ts; then
              echo "⚠️  Missing security header: $header"
              exit 1
            fi
          done

          echo "✅ All required security headers present"

  # Dependency review for PRs - DISABLED (requires Advanced Security)
  # This feature requires GitHub Advanced Security (paid feature)
  # Dependabot will still create PRs for updates via .github/dependabot.yml
  # dependency-review:
  #   name: Dependency Review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Dependency Review
  #       uses: actions/dependency-review-action@v4
  #       with:
  #         fail-on-severity: moderate
  #         deny-licenses: GPL-3.0, AGPL-3.0

  # Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      [
        secret-scan,
        sast-semgrep,
        codeql-analysis,
        dependency-scan,
        security-lint,
        nextjs-security,
        custom-security-rules,
      ]
    if: always()
    steps:
      - name: Generate Security Summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Linting | ${{ needs.security-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Next.js Security | ${{ needs.nextjs-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Custom Rules | ${{ needs.custom-security-rules.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** CodeQL and Semgrep SARIF results require GitHub Advanced Security to appear in the Security tab." >> $GITHUB_STEP_SUMMARY
          echo "Enable it in: Settings → Code security and analysis → GitHub Advanced Security." >> $GITHUB_STEP_SUMMARY

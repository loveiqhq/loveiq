name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.loveiq.org
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: dummy

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            CHANGES="Initial release"
          else
            CHANGES=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Multi-line value via a heredoc delimiter — the old %0A/%25 escaping
          # only worked with the retired ::set-output:: command; written to the
          # $GITHUB_OUTPUT file it stays literal. Random delimiter so a crafted
          # commit message can't terminate the heredoc early.
          DELIM="EOF_$(openssl rand -hex 12)"
          {
            echo "body<<${DELIM}"
            echo "${CHANGES}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Pass the (untrusted) changelog + tag via env, NOT inline `${{ }}` in
        # the script body — inline interpolation of commit-message content into
        # JS is a script-injection sink.
        env:
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: process.env.CHANGELOG_BODY || "",
              draft: false,
              prerelease: tag.includes("-"),
            });

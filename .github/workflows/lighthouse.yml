name: Lighthouse CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.loveiq.org
          # SAYS OUT LOUD THAT THIS IS NOT THE LIVE SITE, which the site URL above
          # otherwise claims. `isProductionSite()` matches on the host allowlist, and off
          # Vercel there is no environment to contradict it — so this build served on
          # localhost loaded the real analytics tags. Only Microsoft Clarity actually
          # recorded, because it is the one tag deliberately not consent-gated and CI never
          # accepts the banner: 177 of 711 sessions over three days on 2026-09-17 were
          # localhost, each a fresh browser viewing one page for ten seconds.
          #
          # The site URL is deliberately KEPT so canonical tags and OG images still look
          # like production for the audit. Any value other than "production" works; the
          # existing environment check does the rest, so no new flag was needed.
          #
          # Only this workflow needs it: it is the one CI job that serves the build in a
          # browser. The others build and stop, so they cannot record anything.
          NEXT_PUBLIC_VERCEL_ENV: ci
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: dummy

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

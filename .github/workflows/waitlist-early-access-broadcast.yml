name: Waitlist early-access broadcast

# Sends the waitlist early-access invitation
# (lib/emails/waitlist-early-access.ts) to active waitlist_user rows that
# haven't already received it. Idempotent via
# waitlist_user.early_access_email_sent_at — already-sent rows are skipped.
#
# Manual-only trigger. Pick apply=true to actually send, optionally set
# "only" to a single email for smoke-testing.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set true to actually send (false = dry-run)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      only:
        description: "Optional: restrict to a single email (smoke test). Leave blank for full broadcast."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: waitlist-early-access-broadcast
  cancel-in-progress: false

jobs:
  send:
    name: Send broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run broadcast script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${INPUT_APPLY:-false}" = "true" ]; then
            ARGS+=("--apply")
          fi
          if [ -n "${INPUT_ONLY:-}" ]; then
            ARGS+=("--only=${INPUT_ONLY}")
          fi
          npx tsx scripts/send-waitlist-early-access.ts "${ARGS[@]}"

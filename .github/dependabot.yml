# Dependabot configuration for automated dependency updates
# This helps keep dependencies secure and up-to-date.
#
# Reviewers come from .github/CODEOWNERS: GitHub removed dependabot.yml's own
# `reviewers` option in 2025. Security updates are not affected by `ignore` below.

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Minor and patch updates arrive as two grouped PRs. Production minors used to
    # sit outside the patch-only group. The docs say such updates get PRs of their
    # own; in practice they did not. With a group PR open, the scheduled run logs
    # "Adding dependencies as handled" for every dependency of that type, then
    # "Found no dependencies to update" (job log 2026-09-28). React 19.3, zod 4.6
    # and other production minors never got a PR.
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind 4 rewrites the styling setup (the PostCSS plugin moved to
      # @tailwindcss/postcss and utilities were renamed). That is a migration with a
      # visual check of every page, not a version bump.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # ESLint 10 crashes with the plugins eslint-config-next brings (import,
      # jsx-a11y, react and react-hooks all accept eslint 9 at most).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Every Stripe minor pins a newer API version, and checkout pins
      # STRIPE_API_VERSION (features/checkout/server/stripeCheckout.ts) on purpose,
      # so a minor alone fails the typecheck and would hold the whole production
      # group red. Bump deliberately: SDK and constant together, then a sandbox
      # checkout. Patches keep the API version and still arrive.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    # One PR for every action. codeql-action's init, analyze and autobuild must
    # share a version (a split bump fails "Loaded a configuration file for version
    # X, but running version Y"), and one PR per action filled Dependabot's default
    # cap of five open PRs, after which it stopped proposing Actions updates
    # (nothing from 2026-08-28 to 2026-10-04).
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
